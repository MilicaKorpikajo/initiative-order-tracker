name: Pages

# Publishes main at the site root and every feature/* branch under
# /preview/<name>/ (see scripts/build-pages.sh).

on:
  push:
    branches: [main, 'feature/**']
  delete: # a deleted branch drops its preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pages only accepts deployments from main, so a push to a feature branch
  # asks main's copy of this workflow to rebuild the site.
  request-deploy:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/build-pages.sh site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
